# ─── Traffic Model ────────────────────────────────────────────
traffic_model:
  # Morning peak: 07:00 - 10:00 IST
  morning_peak:
    start_hour: 7
    end_hour: 10
    arrival_rate_multiplier: 3.0
    departure_rate_multiplier: 0.5

  # Evening peak: 17:00 - 20:00 IST
  evening_peak:
    start_hour: 17
    end_hour: 20
    arrival_rate_multiplier: 1.5
    departure_rate_multiplier: 3.0

  # Night: 22:00 - 06:00 IST
  night:
    start_hour: 22
    end_hour: 6
    arrival_rate_multiplier: 0.1
    departure_rate_multiplier: 0.1

  # Base arrival probability per slot per second (off-peak)
  base_arrival_prob: 0.002
  # Base departure probability per slot per second (off-peak)
  base_departure_prob: 0.002
  # Mean parking duration (minutes)
  mean_parking_duration_minutes: 45
  # Std dev of parking duration (minutes)
  std_parking_duration_minutes: 20

# ─── Event Generation ─────────────────────────────────────────
event_generation:
  # Default events per second
  default_rate: 50
  # Random seed (null = non-reproducible)
  random_seed: 42
  # Source tag for all simulated events
  source_tag: "SIMULATED_SENSOR"

# ─── Fault Injection ─────────────────────────────────────────
fault_injection:
  # Probability a sensor generates a duplicate event
  duplicate_probability: 0.02
  # Probability a sensor generates a delayed (late) event
  late_event_probability: 0.03
  # Max late event delay (seconds)
  max_late_event_delay_seconds: 180
  # Probability an event is invalid/malformed
  invalid_event_probability: 0.01
  # Probability a sensor fails (stops sending) for a period
  sensor_failure_probability: 0.001
  # Probability of out-of-order event
  out_of_order_probability: 0.02

# ─── Simulation Modes ─────────────────────────────────────────
modes:
  normal:
    events_per_second: 50
    description: "Normal operation simulation"

  high_load:
    events_per_second: 500
    description: "High-load simulation"

  peak_hour:
    events_per_second: 100
    morning_peak_multiplier: 5.0
    description: "Peak-hour simulation"

  fault_injection:
    events_per_second: 50
    duplicate_probability: 0.10
    late_event_probability: 0.15
    invalid_event_probability: 0.05
    description: "Fault injection simulation"

  benchmark:
    events_per_second: 1000
    random_seed: 12345
    description: "Reproducible benchmarking mode"
