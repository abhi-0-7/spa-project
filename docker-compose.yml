# ─────────────────────────────────────────────────────────────
# Docker Compose — Smart Parking Occupancy Analytics
# Course: AI372IA, RV College of Engineering, Bengaluru
#
# Services:
#   kafka       — Apache Kafka 3.7 (KRaft mode, no Zookeeper)
#   influxdb    — InfluxDB 2.7 OSS (time-series storage)
#   grafana     — Grafana 10.4 (visualization dashboard)
#
# RAM Budget (conservative for 16 GB laptop):
#   kafka:    ~512 MB JVM heap
#   influxdb: ~256 MB
#   grafana:  ~128 MB
#   Total:    ~896 MB container overhead
# ─────────────────────────────────────────────────────────────

services:

  # ─── Apache Kafka (KRaft mode — no Zookeeper) ──────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: parking-kafka
    ports:
      - "9092:9092"          # External listener (Python clients)
    environment:
      # KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ─── Kafka Topic Initializer ────────────────────────────────
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: parking-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Creating Kafka topics...' &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
          --topic raw-parking-events --partitions 4 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
          --topic aggregated-occupancy-stats --partitions 4 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
          --topic parking-events-dlq --partitions 2 --replication-factor 1 &&
        echo 'Topics created:' &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "
    restart: on-failure

  # ─── InfluxDB 2.7 ──────────────────────────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: parking-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: parking123admin
      DOCKER_INFLUXDB_INIT_ORG: rv-college
      DOCKER_INFLUXDB_INIT_BUCKET: parking_analytics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: parking-super-secret-token
      DOCKER_INFLUXDB_INIT_RETENTION: 0     # Infinite retention for dev
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ─── Grafana 10.4 ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: parking-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: parking123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/smart_parking_overview.json
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./dashboards/grafana/provisioning:/etc/grafana/provisioning
      - ./dashboards/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

# ─── Named Volumes ─────────────────────────────────────────────
volumes:
  kafka_data:
    driver: local
  influxdb_data:
    driver: local
  influxdb_config:
    driver: local
  grafana_data:
    driver: local

# ─── Network ───────────────────────────────────────────────────
networks:
  default:
    name: parking-net
    driver: bridge
