apiVersion: 1

datasources:
  - name: InfluxDB-Parking
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: rvce
      defaultBucket: parking_analytics
      tlsSkipVerify: true
    secureJsonData:
      token: local-parking-token
    isDefault: true
    editable: true
